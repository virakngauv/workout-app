# One-time branch-local dependency lock generation. Removed before the final PR.
name: Bootstrap scaffold lockfile

on:
  push:
    branches: [chore/1-init-expo-tv]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'virakngauv/workout-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate and commit dependency lockfile if absent
        run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock scaffold dependencies'
          git push origin HEAD:chore/1-init-expo-tv
